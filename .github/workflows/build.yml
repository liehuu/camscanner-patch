name: Build CamScanner SaveToFiles IPA

# 触发方式：
#   1. 手动 workflow_dispatch，mode=dylib  → 只编译 dylib（不需要原始 ipa，秒级验证源码能否编过）
#   2. 手动 workflow_dispatch，mode=full   → 完整链路：解包 → 注入 → 重签 → 重打包 → 出 ipa
#                                            （原始 ipa 走 in/ 目录或 ipa_url 直链）
#   3. push 到 main 且改动 src/ 或 tools/  → 自动跑 mode=dylib
#
# 为什么要有 mode=dylib：
#   「能否编译通过」和「注入后能否装上去」是两个失败点。
#   前者只需要源码 + 交叉编译工具链，不需要那个 200MB 的 ipa。
#   把它拆出来，可以在几分钟内拿到编译结论，而不是每次都等整条链路。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dylib = 只编译（无需 ipa）；full = 编译+注入+重签+出 ipa'
        required: true
        default: 'dylib'
        type: choice
        options:
          - dylib
          - full
      ipa_name:
        description: '[full] in/ 目录下的原始 ipa 文件名（留空则取 in/ 下唯一那个 .ipa）'
        required: false
        default: ''
      ipa_url:
        description: '[full] 原始 ipa 直链（填了就从这里下，忽略 in/ 目录）'
        required: false
        default: ''
      bundle_id:
        description: '[full] 目标 Bundle ID（用于校验 ipa 是否为目标应用）'
        required: false
        default: 'com.intsig.CamScannerLite'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
      - 'Makefile'

env:
  DYLIB_NAME: CamScannerSaveToFiles
  INSTALL_NAME: /usr/lib/CamScannerSaveToFiles.dylib
  # 目标应用的可执行文件名（Payload/<App>.app/<App>）
  APP_EXECUTABLE: CamScanner_Lite
  APP_BUNDLE_NAME: CamScanner_Lite.app

jobs:
  build:
    name: Build
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      # 显式声明。若仓库「默认 GITHUB_TOKEN 权限」被管理员设为 restricted，
      # 不写这一项就只剩「无」，读 release asset 会 403 且毫无线索。
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve mode
        id: mode
        run: |
          set -euo pipefail
          # 手动触发读 inputs；push 触发没有 inputs，一律按 dylib 处理
          M="${{ github.event.inputs.mode }}"
          if [ -z "${M}" ]; then M="dylib"; fi
          echo "mode=${M}" >> "${GITHUB_OUTPUT}"
          echo "本次模式: ${M}"

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version || true
          echo "--- iphoneos sdk ---"
          xcrun --sdk iphoneos --show-sdk-version
          echo "--- clang ---"
          clang --version | head -2
          echo "--- python ---"
          python3 --version

      - name: Pre-syntax check (无编译器语法闸门)
        run: |
          set -euo pipefail
          # 放在编译之前：括号配平 / 块配平 / selector 可知性 / hook 签名对齐
          # 这几类缺陷一旦进到 clang 就是一次 3~5 分钟的 CI 往返，
          # 而它们完全可以纯文本判定。
          python3 tools/presyntax.py src/CamScannerSaveToFiles.m
          # 声明顺序：C 无 Hoisting，定义晚于使用就是编译错误。
          # 单独一项，因为上面 6 项都查不到它（括号是平的、块是配的、selector 也是可知的）。
          python3 tools/decl_order.py src/CamScannerSaveToFiles.m
          # 生成的 docx 能否被 Word 打开，是这套 dylib 唯一真正的交付判据。
          # v18/v19 两轮都编译通过、lint 全绿、特征串全中，真机导出的文件
          # 却打不开 —— 因为缺陷在 XML 结构层，编译器看不见。
          # 本项直接读 .m 里的字符串字面量，断言 <w:p> 包裹、rPr 顺序、
          # pgMar 必需属性。放这里，编不过的东西不许编。
          python3 tools/check_render_c.py src/CamScannerSaveToFiles.m
          # v22：手写转文字导出的手写区仍然是图片。
          # 根因是判据顺序（图片关排在文字关前面），不是图片逻辑本身错 ——
          # 编译器、lint、甚至离线渲染样本都看不见这类缺陷
          # （样本里压根没有手写 slice）。
          # 本项断言「文字关必须排在图片关之前」，先跑注入式反向验证再跑正检，
          # 确保它真的在比顺序，而不是只检查关键字存在。
          python3 tools/rev_check_text_priority.py
          python3 tools/check_text_priority.py src/CamScannerSaveToFiles.m
          # v23：排版一致性（首行缩进 + 字号归并）。
          # 用户拿手机预览截图当标准，说「还是不一致」。逐行量墨迹边界后发现两条：
          #   预览里每个段落首行缩进约两字符（续行 x=64、段首 x=99~107），
          #     而在此之前产物里 <w:ind> 出现 0 次，23 段全部顶格；
          #   预览正文字号统一，而产物里 10pt/11pt 各占 7/115，
          #     恰好整段落在第五条、第六条、第十二条上 —— 看起来就是「这几条字小一圈」。
          # 这两条编译器和 lint 都看不见：XML 完全合法，Word 也能打开，只是不像。
          # 先跑反向验证再跑正检 —— v23 升级 C3/C2 判据时它连报两条假 FAIL，
          # 说明「当前代码能过」并不等于「这条检查在检查东西」。
          python3 tools/rev_check_render_c.py
          python3 tools/check_render_c.py src/CamScannerSaveToFiles.m
          # v24：导出面板开关 + 行内版式。
          # 「去除手写 / 去除印章」勾了不生效，根因是压根没读面板开关
          # （CSOcrPage 的 hideWrittenImage / hideStampImage / handWrittenToImage），
          # 而同行多字段粘连，根因是忽略了 para.tabs 与 slice.add_tabstop。
          # 两条都是「少做了一件事」，代码完全合法 —— 编译器与 lint 一律看不见。
          python3 tools/rev_check_v24.py
          python3 tools/check_v24.py src/CamScannerSaveToFiles.m
          # v27：「去除手写 / 去除印章」两轮都没生效，真因不是「没读开关」，
          # 而是**读到的第一份就信了**。v25 的 CSFSPullOptions 一拿到字段就
          # return YES，于是 CSFSReadOptionsFromBottomView 里排第一的
          # bottomView.originalData 直接短路，v25 特意新加的
          # context.allPages 分支一次都没执行过 —— 行为与 v24 逐字节等价。
          # 这类「代码合法但永远走不到」的缺陷，编译器、lint、check_v24 全看不见，
          # 所以单独立一项：断言三个来源都不许短路、返回值必须留变量、
          # 合并必须是 OR 语义、必须有 FINAL 汇总日志。
          python3 tools/rev_check_v27.py
          python3 tools/check_v27.py src/CamScannerSaveToFiles.m

          # v29：开关真身在 CSImageToJsonManager，且属性名少一个 n。
          # v24～v28 五轮门禁全绿却连错五次，就是因为没有任何检查器
          # 看得见「拼写不同」这件事 —— 代码完全合法，只是永远读不到值。
          python3 tools/rev_check_v29.py
          python3 tools/check_v29.py src/CamScannerSaveToFiles.m

          # v30：排版照本地排版引擎的真实公式。
          #
          # 用户的原话点破了前提：「预览时明明是排好版的，
          # 生成 docx 你可以自己写，但排版的逻辑是不是在本地呢」。
          # 反汇编证实排版逻辑确实在本地，整条链在
          # CSWordEditFlowDataManager -setupParaStyleWithAttributeString:
          # para:ocrPage:segment:isCellPara:。本轮修掉三处实质性错误：
          #
          #   ① 行距少了最后一道 clamp。caculateLineHeightMultiple...
          #      的出口无论 lineSpaceMode 是 0/1/2 都夹到 [1.0,1.5]；
          #      v29 没夹，真机 gap=25.94 算出的 1.637x 原样写成
          #      w:line=393，比 App 自己导出的大一档。
          #   ② 缩进换算的两条分支（按字符 / 按 200dpi）是纯猜测，
          #      反汇编证明缩进只乘 ocrPage.scale，与字号无关。
          #   ③ scale 恒为 0 的机制性原因：CSFSCaptureLayoutContext
          #      被放在早退 return 之后，开关读不到时它永远不执行。
          #
          # 这三条 XML 全都合法、Word 都能打开、lint 全绿，
          # 差异只在「像不像」—— 没有任何已有检查器看得见，必须单独立项。
          python3 tools/rev_check_v30.py
          python3 tools/check_v30.py src/CamScannerSaveToFiles.m

          # v31：两个真机反馈的缺陷，都有日志逐行证据。
          #
          # 【一】「文字之间的空格、带下划线的空格都没识别出来」
          #   空格在 OCR JSON 里是**独立 slice**，间隔只体现在它自身的
          #   position/width 上；丢掉这个 slice 就无法从别处恢复，两列文字
          #   会被粘成一串。丢它的地方有两处（CSFSSliceText 的 trim 判空、
          #   段落收集循环的 trim 判空），只修一处仍然丢 —— 所以 S1/S4 分开断言。
          #   「带下划线的空格」是 text=" " + underline=1，text 先丢，
          #   下划线属性随之丢，整条填空横线消失，用户看到的就是「没识别出来」。
          #
          # 【二】「去除手写及去除印章选不选都没用，都是去除状态」
          #   证据是同一进程两次导出：
          #     勾选 → mgr 1 → merged 1
          #     取消 → mgr 0 → merged 1     ← 用户看到的
          #   根因是 v27 的 OR 合并没有**批次**概念，静态全局上一批的 1
          #   永久残留。修法是在批次边界清零（不是改成「最后写入者」——
          #   那会退回 v24～v28 的失败态），所以 R2 要断言顺序。
          #
          # 【三】stype=handwritten 不是「手写图」的判据
          #   日志 33 次跳过全是 cat=0；OCR 对手写体文档的**正文文字**
          #   也标 handwritten。H3 不用正则猜写法，而是把 continue
          #   在「cat≠1 且有文字」场景下**真的求值一遍**，见 rev_check_v31 的 F1~F3。
          #
          #   ⚠ 该结论在 v32 被真机数据推翻，H 组已从 check_v31 撤掉，
          #     迁到 check_v32 按行为重判（理由见下面 v32 段）。
          python3 tools/rev_check_v31.py
          python3 tools/check_v31.py src/CamScannerSaveToFiles.m

          # v32：v31 真机反馈的两个缺陷 —— 一个是我上一轮改错了方向，
          #      一个是宽度字段从来没被读过。
          #
          # 【一】「去除手写选择了不生效，但是去除印章选择了是生效的」
          #   三次导出的 runs 数字三版严丝合缝：
          #     v29 runs=123            （空格被丢，手写保留）
          #     v30 runs=90 + handSkip=33 = 123
          #     v31 runs=170 = 123 + spaceSlices47，handSkip=0 / handKeep=33
          #   170 = 90 + 47 + 33 → 那 33 条 stype=handwritten cat=0 的 slice
          #   **就是手写内容本身**。v30 删得对，错的只是「没勾也删」；
          #   v31 把判据整个废掉，于是开关彻底失效。
          #   另：日志 v21 DIAG slice dict(11) 的键里根本没有 image_category，
          #   所以 v31 的 slCat==1 是恒假的死条件 —— 一条永远不成立的判据，
          #   等于把「开关失效」写成了「合规」。
          #   H1/H2/H3 不用正则，改成把 continue 在三种场景下真的求值：
          #     勾了+stype命中   → 必须删
          #     勾了+cat=1       → 必须删
          #     没勾             → 一条都不许删
          #
          # 【二】「带下划线的空格，你只有空格，下划线明显不够长」
          #   空格 slice 的 text 就是一个 " "，真正的宽度在 slice.width 里，
          #   而该字段此前**从来没被读过**。v32 把它带进 run（kCSFSRunSpaceW），
          #   渲染时按「宽度 pt ÷ 半角空格宽」展开成足够多的空格。
          #   P4/P5/P6 是这次最容易踩的三种翻车：没有上限 clamp（width 单位若错
          #   会算出上万空格把文档撑爆）、展开后反而更短、width 缺失时凭空造空格。
          python3 tools/rev_check_v32.py
          python3 tools/check_v32.py src/CamScannerSaveToFiles.m

          # ── v33：下划线长度仍不对 + 有的空格本来有线却没了 ────────────
          #
          # 真机三条样本把 width 的单位钉死了：
          #     w=56.0 pt=10.5 → 11 个空格
          #     w=12.0 pt=10.5 → 2 个空格
          #     w=36.0 pt=10.5 → 7 个空格
          # 56 ÷ 11 ≈ 5.09pt，正好是 10.5pt 字号的半角空格宽（5.25pt）。
          # 也就是说 width 单位**就是 pt**，v32 还乘了 A4@200dpi 的 0.3597，
          # 把长度做小 2.8 倍 —— 这就是「明显不够长」。
          #
          # W1   宽度直接按 pt 用，不许再出现 200dpi 折算常量
          # W2/W3 保留「不得短于原文字符数」与上限 clamp
          # W4   width 缺失时原样返回，不许凭空造空格
          #
          # F1~F5 是最隐蔽的一半：纯空白 slice 没有 style，run 里既没字体
          # 也没下划线。没有字体 → Word 用 docDefaults 的 Calibri 画空格
          # （0.226em，宋体是 0.5em）→ 宽度直接腰斩。所以必须：
          #     继承相邻文字 run 的字体 → 拿不到就用全文正文字体兜底（SimSun）
          #     且补齐动作必须排在写 XML **之前**
          #
          # U1~U5「本来有线却没了」：
          #   underline 的值可能是 "single"/"thick"/"double"，而 CSFSBoolValue
          #   只认 1/true/yes —— 这些全被判成「没有下划线」，整条填空线消失。
          #   改用否定词黑名单；另外行尾空格的下划线会被 Word 裁掉，
          #   必须换成 U+00A0，且只对带下划线的空白换（否则词间空格变 NBSP，
          #   整行没有断行点）。
          #
          # T0（原 T1/T2 已删）：v33 曾按「宽度 ÷ 字号 ≥ 2em」猜填空线，
          #   该判据已被真机证伪 —— 签字区的排版留白宽度远超 2em，
          #   被画成假下划线。现在只守「不许再用 em 阈值」这一条。
          # S1 空格统计必须打在渲染之后（v32 打在渲染前，日志自相矛盾）。
          python3 tools/rev_check_v33.py
          python3 tools/check_v33.py src/CamScannerSaveToFiles.m

          # ── v34：修「不该有线的地方有线」与「空格下划线还是不够长」──
          #
          # 【假下划线】v33 用「宽度 ÷ 字号 ≥ 2em」猜填空线。把 v32/v33 导出的
          #   同一份文档逐条对齐：空白 run 都是 47 个，带下划线的从 21 涨到 26，
          #   多出来的 5 条全在合同末尾签字区（prev/next 是「董瀚霖/乙方：」
          #   「地址：/电话：」「9845254499/电话：」），那是把「乙方：」
          #   「电话：」推到行右侧的排版留白，宽度当然远超 2em。
          #   → 下划线只允许来自 slice 自带的 font_attribute.underline（H 组）。
          #
          # 【长度不够】同一份 XML 里 47 个空白 run 有 43 个写着
          #   w:ascii="Calibri"。空格是 U+0020，Word 严格按 w:ascii 取字形：
          #     Calibri 0.226em × 10.5pt = 2.37pt
          #     宋体    0.500em × 10.5pt = 5.25pt      差 2.2 倍
          #   按 0.5em 算出 11 个空格，Word 里只占 26pt，而 slice.width 是 56pt。
          #   v33 的兜底只在 face 为空时触发，face 是 "Calibri" 时一次都没跑到
          #   （日志 fillBody 恒为 0）—— 兜底把错误本身藏起来了。
          #   → 判据改成「这个字体撑不撑得住 0.5em」（V 组）。
          #
          # 【宽度精度】个数改 floor 向下取整，余量用 <w:spacing> 摊到每个字符上，
          #   误差压到 1 twip；<w:spacing> 必须排在 <w:sz> 之前（CT_RPr sequence）。
          #   另加内容区宽度上限 —— 18pt×56 空格 = 504pt > 451pt 会把段落撑爆。
          python3 tools/rev_check_v34.py
          python3 tools/check_v34.py src/CamScannerSaveToFiles.m

          # ── v35：修「整篇排版乱七八糟」──
          #
          # 用户：「你看我手机预览的截图，多规整，出租房，和承租方都是单独一行，
          #         你这导出的docx乱七八糟的」
          #
          # 把 v34 导出的 docx 用 Word 打开 → 转 PDF → 逐字量 bbox：
          #   「出 租 方 ：」x0 = 93.0 / 117.1 / 141.3 / 165.4 …
          #   步进 24.2pt（10.5pt 的字本应步进 10.5pt）—— 2.3 倍字距
          # 不是字距被设大了，而是**折行之后 jc=both 把首行强行撑满**。
          #
          # 【为什么折行】自然宽 470.4pt > 页宽 451.3pt，超 19.1pt。
          #   `22018220040518001x` 18 个字符是 Calibri，实测占 134.3pt
          #   （0.71em/字），宋体只要 94.5pt（0.5em）—— 一条 run 就差 40pt。
          #   v34 只统一了「空白 run」的字体，**文字 run 漏了**。
          #   → F 组：文字 run 也走 CSFSIsCJKFace 统一。
          #
          # 【第二层】p3「中介方」折成 3 行、每行一两个字。run 序列是
          #   中介方：|43 空格|<w:tab pos=4513>|3 空格|经纪人：|22 空格
          #   空白已把「经纪人：」推到 225pt，tab 又推一次，两者相加顶爆整行。
          #   → B 组：删掉紧跟已展开空白的 tab；T 组：段尾留白按剩余宽度自适应。
          #
          # 【第三层】v33 注释写着「NBSP 宽度与普通空格一致 0.5em」—— 错的。
          #   用 Word 逐字符量位置实测（10.5pt，字体全写 SimSun）：
          #       U+0020 普通空格  5.25pt = 0.50em
          #       U+00A0 NBSP     10.50pt = 1.00em      ← 整整两倍
          #   → N 组：NBSP 只用于段尾，且个数按 2:1 折半。
          #
          # 【收尾】p2 只超 12pt 却折出一行残字「方）」→ 差 5% 以内压留白挤进一行；
          #   差得多则改左对齐（不压空白，保住用户要的下划线长度）。
          #   标题段（字号 ≥ 正文 1.5 倍）强制居中，不再被红色编号带成右对齐。
          python3 tools/rev_check_v35.py
          python3 tools/check_v35.py src/CamScannerSaveToFiles.m

          # ── v36：出租方一行了，承租方 / 中介方 / 经纪人还不对 ──
          #
          # 用户：「出租方已经是一行了，但是后边承租方，以及中介方，
          #         经纪人都不对」
          #
          # 日志 13 次 v35 overflow，但 v35 squeeze 一次都没出现 ——
          # 「压留白挤进一行」那条分支从未触发，说明问题不在空白长短。
          #
          # 用 Word 转 PDF 逐行量 bbox（页宽 451.3pt，右边距 523.3）：
          #   段落       缩进   内容宽   可用宽   结果
          #   p1 出租方   21pt   413.7   430.3   一行 ✓
          #   p2 承租方   21pt   442.0   430.3   折掉「方）」
          #   p3 中介方   21pt   451.5   430.3   折掉「人：」
          # 而 App 预览截图里这三段**全是顶格的**（「出租方：」与下方
          # 「根据《中华人民共和国民法典》」左边缘对齐）。
          #
          # 把这三段的 <w:ind> 删掉、其余一字不动，重新转 PDF：
          #   p1 485.7 / p2 516.4 / p3 516.8 —— 三段全部一行，都在 523.3 内。
          # 所以折行原因是 21pt 缩进，不是空白。
          #
          # 这 21pt 从哪来：v30 在「indent_first_line 为 0 或缺失」时
          # 兜底写了 2 字符缩进（paraPt * 40 twips），日志里
          # `fallback-2chars` 恰好出现 3 次。但反汇编原文是
          # `cbz x0 → 跳过`：**fl 为 0 就该顶格，不是数据缺失**。
          # 兜底把「明确的顶格」当成「没数据」，给每段都补了 21pt。
          # 这是本项目第三次栽在兜底上（前两次：字体兜底、indent 兜底）。
          #
          # 【v36 两处改动】
          #   ① 删掉兜底：fl==0 → 顶格，一个 twip 都不写（I 组）；
          #   ② 保留一个方向相反的救场：只有「加了缩进会折行、去掉缩进
          #      正好一行」才清缩进，判据交给宽度预算（D 组），
          #      结论用位标志带回渲染端（F 组 / R 组）。
          #
          # 【同时修 v35 的「算了不用」形态】
          #   日志报 `v35 tailfit: ratio=0.836`，XML 里那个 run 仍是
          #   22 个空格 —— 因为压空白只改了 kCSFSRunSpaceW（只参与估算），
          #   而写 XML 走 text.length。估算是按压过的算、实际按没压的排，
          #   两头都不对。→ S 组：宽度字段与字符数必须一起改。
          #
          # 【1pt 临界垫】p3 顶格后需 451.5pt，版心 451.3pt，只差 0.2pt
          #   就折掉「人：」。清过缩进的段落给 20tw 右边距（0.35mm），
          #   肉眼不可见，足以吃掉估算误差与 twips 取整。
          python3 tools/rev_check_v36.py
          python3 tools/check_v36.py src/CamScannerSaveToFiles.m

          # ── v37：每行字数与手机预览对不上 ───────────────────────
          #
          # 用户：「导出的 word 每行文字数目与我手机预览的截图很多不一样」
          #
          # 【根因】w:pgMar 四周写死 1440 twips（72pt / 2.54cm）—— Word 的
          #   默认值，从来没和原文档核对过。版心因此固定成 451.3pt，
          #   而原文档正文几乎贴边。每行比预览少 5~8 个汉字，折行点整体
          #   前移，后面的行全部错位。
          #
          # 【实证】同一份真机导出的 docx，只改左右边距，Word 转 PDF、
          #   pymupdf 逐行量 bbox：
          #     1440 → 41 字 / 「5 单」，共 60 行
          #     1080 → 45 字 / 「单元．了」，55 行
          #      800 → 47 字 / 「在平」，「层2 号」，52 行  ← 与截图逐行一致
          #      720 → 49 字 / 「在平等、」，52 行
          #   再验「只改左右 800」与「四周全改 800」逐行完全一致 →
          #   上下不参与折行，所以只改左右，上下保持 1440。
          #
          # 【连锁】内容区宽度常量 kCSFSContentTwips 9026 → 10306，
          #   并上移到图片渲染之前（图片宽度上限也用它）。这五处阈值
          #   （lineW / maxPt / lim / 均分制表位 / 制表位上限）必须同源，
          #   否则版心变了、判据不变 —— 与 v35 squeeze 一次不触发是同一坑。
          #
          # 【C1 为什么是等式】最容易出的缺陷不是改错值，是**只改一半**：
          #   版心是新的、阈值是旧的，日志一片绿但折行全错。
          #   所以断言 11906 − left − right == 常量，而不是各自比对字面量。
          python3 tools/rev_check_v37.py
          python3 tools/check_v37.py src/CamScannerSaveToFiles.m
          python3 tools/rev_check_final.py
          python3 tools/check_final.py src/CamScannerSaveToFiles.m

      - name: Compile dylib (arm64 + arm64e)
        run: |
          set -euo pipefail
          SDKBASE="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: ${SDKBASE}"
          mkdir -p build
          ARCHS="arm64 arm64e"
          for ARCH in ${ARCHS}; do
            echo "=== 编译 ${ARCH} ==="
            xcrun --sdk iphoneos clang \
              -arch "${ARCH}" \
              -isysroot "${SDKBASE}" \
              -miphoneos-version-min=13.0 \
              -fobjc-arc \
              -fmodules \
              -dynamiclib \
              -install_name "${INSTALL_NAME}" \
              -compatibility_version 1.0.0 \
              -current_version 1.0.0 \
              -Os \
              -Wall -Wextra \
              -Wno-unused-parameter \
              -Wno-deprecated-declarations \
              -o "build/${DYLIB_NAME}.${ARCH}.dylib" \
              src/CamScannerSaveToFiles.m \
              -framework Foundation \
              -framework UIKit
          done

          # 合并成 fat
          xcrun lipo -create \
            "build/${DYLIB_NAME}.arm64.dylib" \
            "build/${DYLIB_NAME}.arm64e.dylib" \
            -output "build/${DYLIB_NAME}.dylib"

          echo "=== 产物架构 ==="
          xcrun lipo -info "build/${DYLIB_NAME}.dylib"
          echo "=== 导出符号（应有 constructor）==="
          xcrun nm -gU "build/${DYLIB_NAME}.dylib" 2>/dev/null | head -20 || true

      - name: Lint dylib (崩宿主专项检查)
        run: |
          set -euo pipefail
          # 先跑判据自测：lint 自己的规则也必须被验证。
          # 这不是形式主义 —— lint_dylib.py 的 B3 判据已经被证明会误报两次
          # （startswith("_") 全跳过、前缀白名单误判 _dlsym/_fopen/_fclose），
          # 没有自测的话，这类回归会一路带到设备上才发现。
          python3 tools/lint_selftest.py
          # 再跑真检查；源码层始终跑，产物层在编译后才做
          SRC_FILE=src/CamScannerSaveToFiles.m python3 tools/lint_dylib.py "build/${DYLIB_NAME}.dylib"

      # ═══════════════════════════════════════════════════════════════════
      # 以下步骤只在 mode=full 时执行，全部需要原始 ipa
      # ═══════════════════════════════════════════════════════════════════

      - name: Locate input ipa
        if: steps.mode.outputs.mode == 'full'
        id: locate
        run: |
          set -euo pipefail
          mkdir -p in
          URL="${{ github.event.inputs.ipa_url }}"
          if [ -n "${URL}" ]; then
            echo "从直链下载: ${URL}"
            # 私有 release asset 走 API 时需要 octet-stream；普通直链带不带都无妨。
            # -L 跟随跳转（GitHub release 会 302 到 objects.githubusercontent.com）
            #
            # 403 排查留档（2026-10-26 真实踩过）：
            #   asset 挂在 **draft** release 下时，contents:read 的 GITHUB_TOKEN
            #   读不到它 —— draft 资产只对具备 contents:write 的集成开放，
            #   返回的是 403 而不是 404，光看状态码会以为是权限配错。
            #   解决：把承载输入包的 release 转正（draft:false，仓库 private
            #   依然保证外部不可见），或给 job 加 contents:write。
            if ! curl -fL --retry 3 --retry-delay 2 \
                 -H "Authorization: Bearer ${{ github.token }}" \
                 -H "Accept: application/octet-stream" \
                 -o "in/_downloaded.ipa" "${URL}"; then
              echo "::error::下载输入 ipa 失败。若为 403：① asset 是否在 draft release 里" \
                          "（转正或用 contents:write）② 仓库默认 GITHUB_TOKEN 权限是否被设为 restricted。"
              ls -la in/ || true
              exit 1
            fi
            IPA="in/_downloaded.ipa"
          else
            IPA_NAME="${{ github.event.inputs.ipa_name }}"
            ls -la in/ || true
            if [ -n "${IPA_NAME}" ] && [ -f "in/${IPA_NAME}" ]; then
              IPA="in/${IPA_NAME}"
            else
              # 只取纯 .ipa，排除可能残留的 _downloaded.ipa 干扰计数
              COUNT="$(ls -1 in/*.ipa 2>/dev/null | wc -l | tr -d ' ')"
              if [ "${COUNT}" -gt 1 ]; then
                echo "::error::in/ 下有 ${COUNT} 个 ipa，容易拿错包。请只保留一个，或用 ipa_name 显式指定。"
                ls -1 in/*.ipa
                exit 1
              fi
              IPA="$(ls -1 in/*.ipa 2>/dev/null | head -1 || true)"
            fi
          fi

          if [ -z "${IPA}" ] || [ ! -f "${IPA}" ]; then
            echo "::error::未找到输入 ipa。把原始 ipa 放到 in/（见 in/README.md），或填 ipa_url。"
            exit 1
          fi
          # 至少 10MB，防止把 HTML 错误页当成 ipa
          SIZE="$(wc -c < "${IPA}" | tr -d ' ')"
          if [ "${SIZE}" -lt 10485760 ]; then
            echo "::error::${IPA} 只有 ${SIZE} 字节，不像 ipa（可能下载到了错误页）"
            head -c 400 "${IPA}" || true
            exit 1
          fi
          echo "ipa=${IPA}" >> "${GITHUB_OUTPUT}"
          echo "使用 ipa: ${IPA} ($(du -h "${IPA}" | cut -f1))"

      - name: Unpack ipa
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          unzip -q "${{ steps.locate.outputs.ipa }}" -d work
          APP_DIR="work/Payload/${APP_BUNDLE_NAME}"
          if [ ! -d "${APP_DIR}" ]; then
            echo "::error::Payload 下没有 ${APP_BUNDLE_NAME}"
            ls -la work/Payload || true
            exit 1
          fi
          echo "APP_DIR=${APP_DIR}" >> "${GITHUB_ENV}"

      - name: Guard against double injection
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # ─────────────────────────────────────────────────────────────
          # 这一步拦的是「跑起来崩」，不是「编不过」。
          # 若误把已注入过的包当作输入，会得到：
          #   LC_LOAD_DYLIB 里有两条同名条目 → dyld 只加载一份，但方法会交换两次
          #   （一次指向原 IMP，一次指向已交换的 IMP）→ 递归调用 / 栈溢出 → 宿主闪退
          # 所以必须在这里硬拦，而不是指望后面 install_name_tool 报错。
          # ─────────────────────────────────────────────────────────────
          BIN="${APP_DIR}/${APP_EXECUTABLE}"
          # grep -c 无匹配时退出码为 1，在 pipefail 下会让整步失败（假阳性）。
          # 这里显式吞掉退出码，只看输出的数字。
          HIT="$(xcrun otool -L "${BIN}" | grep -c "${DYLIB_NAME}" || true)"
          HIT="${HIT:-0}"
          echo "主二进制中 ${DYLIB_NAME} 加载项数量: ${HIT}"
          if [ "${HIT}" -ne 0 ]; then
            echo "::error::输入 ipa 已经被注入过（主二进制已有 ${DYLIB_NAME}）。请使用原始未修改的包。"
            xcrun otool -L "${BIN}" | grep "${DYLIB_NAME}" || true
            exit 1
          fi
          if [ -e "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib" ]; then
            echo "::error::输入 ipa 内已存在 Frameworks/${DYLIB_NAME}.dylib，说明是注入过的包。"
            exit 1
          fi
          # 原始包应带合法 _CodeSignature；若已被剥离，多半经过第三方重签/改包，拒绝在未知基线上作业
          if [ ! -d "${APP_DIR}/_CodeSignature" ]; then
            echo "::warning::输入包没有 _CodeSignature，可能已被处理过。将以现有内容为基线继续。"
          fi
          echo "OK: 输入包干净，可以注入"

      - name: Verify target app
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_DIR}/Info.plist")"
          echo "Bundle ID: ${BID}"
          EXPECT="${{ github.event.inputs.bundle_id }}"
          if [ -z "${EXPECT}" ]; then EXPECT="com.intsig.CamScannerLite"; fi
          if [ "${BID}" != "${EXPECT}" ]; then
            echo "::error::Bundle ID 不匹配，期望 ${EXPECT}，实际 ${BID}"
            exit 1
          fi
          # 版本核对（补丁是针对 7.26.5 的私有类与方法实现的，版本不符直接拒绝）
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP_DIR}/Info.plist")"
          echo "Version: ${VER}"
          if [ "${VER}" != "7.26.5" ]; then
            echo "::warning::版本为 ${VER}，补丁按 7.26.5 的符号与签名编写，行为可能不符预期。"
          fi
          # 关键私有类必须存在，否则说明目标不对
          #
          # 注意：这里不能用 `nm -gU | grep "_OBJC_CLASS_\$_CSShareManager"`。
          # 实测本包（7.26.5，Flutter + Swift 混编）里 **没有** 这种经典 ObjC 类符号，
          # 类名是以裸 C 字符串形式存在于类名区：
          #   0x7d48de0  "CSShareManager"
          #   0x7d490d7  "CSActivityUtil"
          #   0x7d49a07  "CSShareModel"
          # 用符号表判断会 100% 误判为「不是目标应用」而拦住整条流水线。
          #
          # 也不用 `strings | grep -qx`：macOS 的 strings 有最小长度与截断行为，
          # 且在 pipefail 下无匹配会污染退出码。改为独立的 Python 检查脚本，
          # 做字节级精确匹配（b"\0ClassName\0"），既能保证是完整类名，
          # 又不依赖平台工具差异，也不受 YAML heredoc 缩进干扰。
          BIN="${APP_DIR}/${APP_EXECUTABLE}"
          python3 tools/check_classes.py "${BIN}" CSShareManager CSActivityUtil CSShareModel

      - name: Inject LC_LOAD_DYLIB
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          BIN="${APP_DIR}/${APP_EXECUTABLE}"
          cp "${BIN}" "${BIN}.orig"

          echo "=== 注入前 ==="
          python3 tools/inject_dylib.py --check "${BIN}" "${INSTALL_NAME}"
          python3 tools/inject_dylib.py "${BIN}" "${INSTALL_NAME}"

          echo "=== 校验 ==="
          xcrun otool -l "${BIN}" | grep -A2 "LC_LOAD_DYLIB" | grep "${DYLIB_NAME}" || {
            echo "::error::注入失败"
            exit 1
          }

      - name: Embed dylib into app
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p "${APP_DIR}/Frameworks"
          # 放到 Frameworks/ 下并用 @executable_path 相对路径，避免 /usr/lib 需要真实写入系统分区
          cp "build/${DYLIB_NAME}.dylib" "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib"
          xcrun install_name_tool -id "@executable_path/Frameworks/${DYLIB_NAME}.dylib" \
            "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib"
          # 把主二进制里刚注入的 /usr/lib/... 改指到 Frameworks
          xcrun install_name_tool -change "${INSTALL_NAME}" \
            "@executable_path/Frameworks/${DYLIB_NAME}.dylib" \
            "${APP_DIR}/${APP_EXECUTABLE}"
          echo "=== 最终加载项 ==="
          xcrun otool -L "${APP_DIR}/${APP_EXECUTABLE}" | grep "${DYLIB_NAME}"

      - name: Sign (ad-hoc)
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          ENT="tools/entitlements.plist"
          SIGN_ID="-"     # ad-hoc。LiveContainer 安装时会用 LC 自身证书重新签名，
                          # 所以这里的签名只是为了让包在结构上自洽，最终签名由 LC 完成。
          # 顺序很重要：先里后外。--deep 会重新签内嵌组件，
          # 所以对 app 的 --deep 签必须放最后，否则会覆盖 dylib 的签名。
          # 步骤 1：签 dylib
          codesign -f -s "${SIGN_ID}" --timestamp=none \
            "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib"
          # 步骤 2：签 app 内其它 Frameworks（原始包里可能已有）
          if [ -d "${APP_DIR}/Frameworks" ]; then
            find "${APP_DIR}/Frameworks" -name "*.dylib" -o -name "*.framework" 2>/dev/null | \
            while IFS= read -r f; do
              [ "${f}" = "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib" ] && continue
              codesign -f -s "${SIGN_ID}" --timestamp=none "${f}" || true
            done
          fi
          # 步骤 3：签插件与 Watch 扩展（若存在）
          if [ -d "${APP_DIR}/PlugIns" ]; then
            codesign -f -s "${SIGN_ID}" --timestamp=none --deep "${APP_DIR}/PlugIns" || true
          fi
          # 步骤 4：签主二进制（带 entitlements）
          codesign -f -s "${SIGN_ID}" --timestamp=none \
            --entitlements "${ENT}" \
            "${APP_DIR}/${APP_EXECUTABLE}"
          # 步骤 5：最后签整个 bundle（--deep 兜底，放最后才不会被前面覆盖）
          codesign -f -s "${SIGN_ID}" --timestamp=none \
            --entitlements "${ENT}" \
            --deep "${APP_DIR}"
          echo "=== 签名校验 ==="
          codesign -dv --verbose=2 "${APP_DIR}" 2>&1 | head -20
          echo "--- dylib 自身签名 ---"
          codesign -dv --verbose=2 "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib" 2>&1 | head -12
          # 确认注入的加载项与 dylib 的 id 一致（不一致 = 装上去闪退）
          LOADED="$(xcrun otool -L "${APP_DIR}/${APP_EXECUTABLE}" | grep "${DYLIB_NAME}" | awk '{print $1}')"
          ID="$(xcrun otool -D "${APP_DIR}/Frameworks/${DYLIB_NAME}.dylib" | tail -1)"
          echo "loaded: ${LOADED}"
          echo "id    : ${ID}"
          if [ "${LOADED}" != "${ID}" ]; then
            echo "::error::install_name 不匹配：主二进制期望 ${LOADED}，dylib 实际 id ${ID}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_DIR}" 2>&1 | head -20 || {
            echo "::warning::ad-hoc 签名严格校验不通过（正常现象，ad-hoc 无锚点）"
          }

      - name: Repack ipa
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -euo pipefail
          OUT="out/CamScanner_7.26.5_SaveToFiles.ipa"
          mkdir -p out
          rm -f "${OUT}"
          # 不删 _CodeSignature：上一步 codesign 刚生成它，删掉会让 bundle
          # 「主二进制有 embedded signature、资源 seal 目录却不在」的混合态。
          # LiveContainer 导入本就会用自己的证书重签，保留原签名目录是
          # 冗余但无害的正确态；删掉则是把一个未知态交给下游。
          # 这里只做存在性确认，不写不删。
          SIG="${APP_DIR}/_CodeSignature"
          if [ -f "${SIG}/CodeResources" ]; then
            echo "OK: _CodeSignature/CodeResources 在位（codesign 产物已保留）"
          else
            echo "::warning::未见到 _CodeSignature/CodeResources —— 若导入器要求资源 seal，需回头查签名步骤"
          fi
          # 只打 Payload：ipa 规范只需要这个目录，顶层元数据不是安装必需。
          ( cd work && zip -qry "../${OUT}" Payload )
          echo "=== 产物 ==="
          ls -la "${OUT}"
          unzip -l "${OUT}" | head -12
          shasum -a 256 "${OUT}"

      - name: Upload ipa
        if: steps.mode.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-SaveToFiles-ipa
          path: out/*.ipa
          retention-days: 14

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: CamScannerSaveToFiles-dylib
          path: |
            build/CamScannerSaveToFiles.dylib
            build/CamScannerSaveToFiles.arm64.dylib
            build/CamScannerSaveToFiles.arm64e.dylib
          retention-days: 14